name: Checkstyle

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  checkstyle:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Selecionar arquivos Java
        id: arquivos
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMR \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
              -- 'src/main/java/**/*.java' > arquivos-java.txt
          else
            find src/main/java -type f -name '*.java' > arquivos-java.txt
          fi

          echo "Arquivos que serao analisados:"
          cat arquivos-java.txt

      - name: Rodar Checkstyle
        shell: bash
        run: |
          mapfile -t ARQUIVOS < arquivos-java.txt

          if [ ${#ARQUIVOS[@]} -eq 0 ]; then
            echo "Nenhum arquivo Java foi alterado."
            exit 0
          fi

          java -jar checkstyle-10.21.1-all.jar \
            -c checkstyle.xml "${ARQUIVOS[@]}" | tee resultado-checkstyle.txt

          if grep -qE '^\[(WARN|ERROR)\]' resultado-checkstyle.txt; then
            echo "O Checkstyle encontrou problemas nos arquivos alterados."
            exit 1
          fi
